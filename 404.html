<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lider 10</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ★★★★★ ESTE ARQUIVO E A REDE DE SEGURANCA DAS ROTAS (v33k.3046)
  ──────────────────────────────────────────────────────────────────────────
  O painel roda no GitHub Pages, e o Pages NAO TEM REESCRITA DE ROTA: ele
  serve arquivo, e para qualquer caminho que nao seja arquivo ele serve este
  `404.html`. Sem isto, abrir `lider10.com.br/app/pedidos` mostraria a pagina
  de erro do Pages em vez do painel.

  O que ele faz: devolve a pessoa para a raiz levando o caminho pedido em
  `?lcrota=`, e o painel reescreve o endereco de volta para o que ela
  digitou. A pessoa ve `/app/pedidos` na barra, que e o que importa.

  ★★★ O CAMINHO MELHOR, e ele tem Cloudflare na frente do Pages: uma Rewrite
    Rule mandando `/app/*` para `/index.html`. Ai a resposta e 200, sem volta
    extra e sem piscada, e este arquivo nunca e chamado. O passo a passo esta
    no COMECAR-POR-AQUI, no bloco das rotas.
    Com a regra OU sem a regra, o painel funciona. Uma nao depende da outra.

  ★★ POR QUE `location.replace` E NAO `href`: `replace` nao deixa esta pagina
    no historico. Com `href`, o botao voltar traria a pessoa para ca, que
    redirecionaria de novo, e o voltar nunca voltaria.

  ★ NAO EDITE A MAO sem ler o bloco das rotas no COMECAR-POR-AQUI: o nome do
    parametro (`lcrota`) e a pasta (`app`) sao combinados com o painel.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; }
</style>
<script>
  (function () {
    try {
      var l = window.location;
      var rota = l.pathname + l.search + l.hash;
      // ja esta na raiz: nada a resgatar, so entra no painel
      if (rota === '/' || rota === '') { l.replace('/'); return; }
      l.replace('/?lcrota=' + encodeURIComponent(rota));
    } catch (e) {
      try { window.location.replace('/'); } catch (e2) {}
    }
  })();
</script>
</head>
<body>
<noscript>
  <p style="color:#e5e7eb;font:16px/1.6 system-ui,sans-serif;padding:24px">
    Abra <a style="color:#93c5fd" href="/">lider10.com.br</a> para entrar no sistema.
  </p>
</noscript>
</body>
</html>
