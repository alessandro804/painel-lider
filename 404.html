<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Lider 10</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  ★★★★★ ESTE ARQUIVO E A REDE DE SEGURANCA DAS ROTAS DO PAINEL (v33k.3047)
  ──────────────────────────────────────────────────────────────────────────
  O site roda no GitHub Pages, e o Pages NAO TEM REESCRITA DE ROTA: ele serve
  arquivo, e para qualquer caminho que nao seja arquivo serve este `404.html`.
  Sem isto, abrir `lider10.com.br/app/pedidos` mostraria a pagina de erro do
  Pages em vez do painel.

  ★★★★★ E ELE SO AGE EM `/app/`, E ISSO NAO E DETALHE: a RAIZ deste dominio e
    o SITE DE VENDAS, nao o painel. O painel mora em `/app/index.html`. Um 404
    que mandasse tudo para o painel faria quem digitasse `lider10.com.br/precos`
    cair dentro do sistema. Entao: caminho que comeca com `/app/` e resgatado;
    qualquer outro ve a mensagem abaixo e o caminho de volta para o site.

  ★★★ O 404 TEM DE FICAR NA RAIZ DO REPOSITORIO. O GitHub Pages so usa o
    `404.html` da raiz; um dentro de `/app/` seria ignorado e o resgate nunca
    aconteceria.

  ★★★★★ E ESTE ARQUIVO E O CAMINHO DEFINITIVO, NAO UM REMENDO: conferido em
    22/10 no painel do dominio, o Cloudflare esta como DNS ONLY em todas as
    linhas, ou seja NAO esta na frente do Pages. Regra de reescrita so vale
    para trafego proxiado, entao ela nao e uma opcao. Ligar o proxio so por
    causa disso arriscaria laco de redirecionamento por modo de SSL, para
    economizar UMA volta na entrada por link direto. Nao vale.

  ★★ POR QUE `location.replace` E NAO `href`: `replace` nao deixa esta pagina
    no historico. Com `href`, o botao voltar traria a pessoa para ca, que
    redirecionaria de novo, e o voltar nunca voltaria.

  ★ NAO EDITE A MAO sem ler o bloco das rotas no COMECAR-POR-AQUI: o nome do
    parametro (`lcrota`) e a pasta (`app`) sao combinados com o painel.
  ══════════════════════════════════════════════════════════════════════════
-->
<script>
  (function () {
    try {
      var l = window.location;
      var p = String(l.pathname || '');
      // ★ fora de /app/ este arquivo NAO redireciona nada: aqui e o site de
      //   vendas, e o 404 dele continua sendo um 404.
      if (p.indexOf('/app/') !== 0) return;
      // ja e o proprio painel: so entra
      if (p === '/app/' || p === '/app/index.html') { l.replace('/app/index.html'); return; }
      l.replace('/app/index.html?lcrota=' + encodeURIComponent(p + l.search + l.hash));
    } catch (e) {
      try { window.location.replace('/app/index.html'); } catch (e2) {}
    }
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f8fafc; color: #0f172a;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .caixa { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: #475569; }
  a {
    display: inline-block; background: #0f172a; color: #fff; text-decoration: none;
    padding: 11px 20px; border-radius: 9px; font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    p { color: #94a3b8; }
    a { background: #e2e8f0; color: #0f172a; }
  }
</style>
</head>
<body>
  <div class="caixa">
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou foi movido.</p>
    <a href="/">Ir para a página inicial</a>
  </div>
</body>
</html>
